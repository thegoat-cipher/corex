[package]
name = "corex"
version = "0.3.0"
edition = "2021"
default-run = "corex"
description = "CoreX compiler: lexer, parser, semantic analysis, LLVM 20 IR backend"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thegoat-cipher/corex"

[lib]
name = "corex"
path = "src/lib.rs"

[[bin]]
name = "corex"
path = "src/main.rs"

[[bin]]
name = "corex-lsp"
path = "src/lsp_main.rs"

[profile.release]
opt-level = 2
